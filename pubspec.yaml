name: mylonite
description: Mylonite IDE — an offline-first mobile development environment for Android. Edit, run, and debug code with a local AI agent.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^15.1.2

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Persistence ───────────────────────────────────────────────────────────
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  path: ^1.9.1

  # ── Serialization ─────────────────────────────────────────────────────────
  json_annotation: ^4.9.0

  # ── ZIP / Archive ──────────────────────────────────────────────────────────
  archive: ^3.6.1

  # ── Code Editor ───────────────────────────────────────────────────────────
  # flutter_code_editor: syntax highlighting (100+ languages via highlight.dart),
  # line numbers gutter, code folding, CodeController (extends TextEditingController).
  # Architecture: 02-ARCHITECTURE.md ADR — Flutter editor widget, FR-020–FR-033
  flutter_code_editor: ^0.3.2
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

  # ── Utilities ─────────────────────────────────────────────────────────────
  equatable: ^2.0.7
  uuid: ^4.5.1
  intl: ^0.20.2

  # ── UI ────────────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.15

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.14
  riverpod_generator: ^2.6.1
  json_serializable: ^6.9.4
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
